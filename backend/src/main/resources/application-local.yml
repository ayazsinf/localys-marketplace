spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/appdb
    username: appuser
    password: apppass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  application:
    name: localys-marketplace

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  keycloak:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/localys-realm}
    client-id: ${OIDC_CLIENT_ID:localys-frontend}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:localys-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:localys-backend-secret}
  media:
    upload-dir: uploads
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/checkout?success=true}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/checkout?canceled=true}

server:
  port: 8080
logging:
  level:
    org.springframework: DEBUG

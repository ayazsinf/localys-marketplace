spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}
  application:
    name: localys-marketplace

  flyway:
    enabled: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    sql: trace

app:
  locale:
    default: ${APP_DEFAULT_LOCALE:en}
  keycloak:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/localys-realm}
    client-id: ${OIDC_CLIENT_ID:localys-frontend}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:localys-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:localys-backend-secret}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      success-url: http://localhost:4200/checkout?success=true
      cancel-url: http://localhost:4200/checkout?canceled=true
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail:
    enabled: ${APP_MAIL_ENABLED:${MAIL_ENABLED:false}}
    from: ${MAIL_FROM:no-reply@localys.example}
  moderation:
    auto-approval-enabled: ${APP_MODERATION_AUTO_APPROVAL_ENABLED:false}
    trusted-vendor-only: ${APP_MODERATION_TRUSTED_VENDOR_ONLY:true}
    require-image: ${APP_MODERATION_REQUIRE_IMAGE:true}
    max-auto-approve-price: ${APP_MODERATION_MAX_AUTO_APPROVE_PRICE:1000}
    min-description-length: ${APP_MODERATION_MIN_DESCRIPTION_LENGTH:20}
    banned-terms: ${APP_MODERATION_BANNED_TERMS:whatsapp,telegram,crypto,bitcoin}
  listings:
    removed-visible-days: ${APP_LISTINGS_REMOVED_VISIBLE_DAYS:7}
    max-active-days: ${APP_LISTINGS_MAX_ACTIVE_DAYS:45}
    expiration-batch-size: ${APP_LISTINGS_EXPIRATION_BATCH_SIZE:200}
    expiration-cron: ${APP_LISTINGS_EXPIRATION_CRON:0 15 * * * *}

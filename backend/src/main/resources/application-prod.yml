spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  keycloak:
    issuer-uri: ${OIDC_ISSUER_URI}
    client-id: ${OIDC_CLIENT_ID:localys-frontend}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:localys-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  media:
    storage: ${APP_MEDIA_STORAGE:r2}
    upload-dir: ${APP_MEDIA_UPLOAD_DIR:/app/uploads}
    r2:
      bucket: ${R2_BUCKET}
      endpoint: ${R2_ENDPOINT}
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}
      public-base-url: ${R2_PUBLIC_BASE_URL}
  payment:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      success-url: ${STRIPE_SUCCESS_URL:https://localys.shop/checkout?success=true}
      cancel-url: ${STRIPE_CANCEL_URL:https://localys.shop/checkout?canceled=true}

logging:
  level:
    org.springframework: INFO
    sql: WARN

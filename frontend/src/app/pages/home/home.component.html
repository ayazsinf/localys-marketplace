<div class="home-container">

  <main class="main-content">
    <div class="container">
      <div class="content-wrapper">
        <aside class="sidebar-container">
          <app-sidebar (categorySelected)="onCategorySelected($event)"
                       (priceRangeSelected)="onPriceRangeChange($event)"></app-sidebar>
        </aside>

        <section class="products-section">
          <div class="section-header">
            <div class="sort-options">
                <select
                        id="sortSelect"
                        class="sort-select"
                        [ngModel]="sortOption()"
                        (ngModelChange)="onSortChange($event)">
                    <option value="priceLowHigh">{{ 'HOME.SORT_LOW_HIGH' | translate }}</option>
                    <option value="priceHighLow">{{ 'HOME.SORT_HIGH_LOW' | translate }}</option>
                    <option value="nameAZ">{{ 'HOME.SORT_NAME' | translate }}</option>
                </select>
            </div>
          </div>

          <div class="products-grid">
            @for (product of visibleProducts(); track product.id){
              <app-product-card
                      [product]="product"
                     >
              </app-product-card>
            }

          </div>

          <div class="load-more" *ngIf="hasMoreProducts()">
            <button class="load-more-btn" type="button" (click)="loadMoreProducts()">
              {{ 'HOME.LOAD_MORE' | translate }}
            </button>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.dev}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
    volumes:
      - dev_dbdata:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    env_file: ${APP_ENV_FILE:-.env.dev}
    environment:
      KC_DB: postgres
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB_URL: ${KC_DB_URL:-jdbc:postgresql://db:5432/keycloak_db}
      KC_DB_USERNAME: ${KC_DB_USERNAME:-appuser}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-apppass}
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      - db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ${APP_ENV_FILE:-.env.dev}
    environment:
      SPRING_PROFILES_ACTIVE: dev
    volumes:
      - dev_media_uploads:/app/uploads
    depends_on:
      - db
      - keycloak

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - dev_media_uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
      - keycloak

volumes:
  dev_dbdata:
  dev_media_uploads:

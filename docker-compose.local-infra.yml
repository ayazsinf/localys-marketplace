name: localys-local

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    ports:
      - "5433:5432"
    volumes:
      - local_dbdata:/var/lib/postgresql/data
      - ./docker/postgres/init-local.sql:/docker-entrypoint-initdb.d/init-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloakdb
      KC_DB_USERNAME: appuser
      KC_DB_PASSWORD: apppass
    volumes:
      - local_keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  local_dbdata:
  local_keycloak_data:
